<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Numerology with Hari - Palm Reading</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  margin: 0;
  display: flex;
  height: 100vh;
}

/* LEFT PANEL */
.left {
  width: 40%;
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

.left img {
  width: 80%;
  border-radius: 10px;
}

/* RIGHT PANEL */
.right {
  width: 60%;
  padding: 20px;
}

input, button {
  padding: 10px;
  margin: 10px 0;
  width: 100%;
}

#preview {
  width: 200px;
  margin-top: 10px;
}

.report {
  margin-top: 20px;
  padding: 15px;
  background: #f3f3f3;
}
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">
  <h2>🔮 Numerology with Hari</h2>
  <p>AI Palm Reading System</p>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Palmistry_hand.jpg/320px-Palmistry_hand.jpg">
</div>

<!-- RIGHT SIDE -->
<div class="right">

  <h3>Upload Your Palm Image</h3>

  <input type="text" id="name" placeholder="Enter Your Name">

  <input type="file" accept="image/*" capture="environment" id="imageInput">

  <img id="preview">

  <button onclick="generateReport()">Generate Report</button>

  <div id="output" class="report"></div>

  <button onclick="downloadPDF()">Download PDF</button>

</div>

<script>

// IMAGE PREVIEW
document.getElementById("imageInput").onchange = function(event) {
  const reader = new FileReader();
  reader.onload = function() {
    document.getElementById("preview").src = reader.result;
  }
  reader.readAsDataURL(event.target.files[0]);
}

// GENERATE REPORT (STATIC DEMO - later AI connect karenge)
function generateReport() {
  const name = document.getElementById("name").value;

  const report = `
  <h3>🔍 Palm Analysis Report - ${name}</h3>

  <b>Past:</b><br>
  Aapki life me early struggle aur confusion raha hai.

  <br><br>
  <b>Present:</b><br>
  Abhi aap growth aur transition phase me ho. Career focus strong hai.

  <br><br>
  <b>Future:</b><br>
  35–45 age me strong financial growth aur stability milegi.

  <br><br>
  <b>Remedies:</b><br>
  ✔ Daily consistency<br>
  ✔ Hanuman Chalisa<br>
  ✔ Focus on one skill<br>
  ✔ Avoid overthinking
  `;

  document.getElementById("output").innerHTML = report;
}

// PDF DOWNLOAD
function downloadPDF() {
  const content = document.getElementById("output").innerText;

  const blob = new Blob([content], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Palm_Report.txt";
  link.click();
}

</script>

</body>
</html>
